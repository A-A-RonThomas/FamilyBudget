{% extends "layout.html" %}
{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <h4 class="mb-4 text-center">Import Bank CSV</h4>

        <div id="alert-container"></div>

        <div class="card mb-3">
            <div class="card-body">

                <!-- File input -->
                <div class="mb-3">
                    <label for="csv-file" class="form-label fw-semibold">CSV File</label>
                    <input class="form-control" type="file" id="csv-file" accept=".csv">
                </div>

                <!-- Account selector -->
                <div class="mb-3">
                    <label for="account-select" class="form-label fw-semibold">Account</label>
                    <select class="form-select" id="account-select">
                        <option value="">-- Select Account --</option>
                        <option value="__new__">+ Add new account...</option>
                    </select>
                </div>

                <!-- New account input -->
                <div class="mb-3 d-none" id="new-account-section">
                    <label for="new-account-input" class="form-label fw-semibold">New Account Name</label>
                    <input type="text" class="form-control" id="new-account-input" placeholder="e.g. Joint Checking">
                </div>

                <!-- Negate checkbox -->
                <div class="mb-3 form-check">
                    <input class="form-check-input" type="checkbox" id="negate-check">
                    <label class="form-check-label" for="negate-check">
                        Negate amounts (use for credit cards)
                    </label>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary" id="import-btn" onclick="doImport()">Import</button>
                </div>
            </div>
        </div>

        <!-- Result summary -->
        <div id="import-summary" class="mt-4 d-none">
            <div class="card">
                <div class="card-body text-center">
                    <p class="mb-1">
                        <span class="text-success fw-semibold" id="imported-count"></span> transactions imported
                    </p>
                    <p class="mb-3">
                        <span class="text-secondary fw-semibold" id="skipped-count"></span> skipped (already exist)
                    </p>
                    <a href="/" class="btn btn-primary">View Transactions</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // load accounts on page load
    async function loadAccounts() {
        try {
            const res = await fetch('/api/accounts');
            const accounts = await res.json();
            const select = document.getElementById('account-select');
            // insert before the "+ Add new account..." option
            const newOption = select.querySelector('option[value="__new__"]');
            accounts.forEach(a => {
                const opt = new Option(a.name.replace(/\b\w/g, c => c.toUpperCase()), a.id);
                select.insertBefore(opt, newOption);
            });
        } catch (err) {
            console.error('Failed to load accounts:', err);
        }
    }

    document.getElementById('account-select').addEventListener('change', function() {
        document.getElementById('new-account-section').classList.toggle('d-none', this.value !== '__new__');
        if (this.value === '__new__') {
            setTimeout(() => document.getElementById('new-account-input').focus(), 50);
        }
    });

    async function doImport() {
        const alertContainer = document.getElementById('alert-container');
        const summary = document.getElementById('import-summary');
        const btn = document.getElementById('import-btn');

        alertContainer.innerHTML = '';
        summary.classList.add('d-none');

        const file = document.getElementById('csv-file').files[0];
        if (!file) {
            alertContainer.innerHTML = `<div class="alert alert-warning">Please select a CSV file.</div>`;
            return;
        }

        let accountId = document.getElementById('account-select').value;
        if (!accountId) {
            alertContainer.innerHTML = `<div class="alert alert-warning">Please select an account.</div>`;
            return;
        }

        // create new account if needed
        if (accountId === '__new__') {
            const newName = document.getElementById('new-account-input').value.trim();
            if (!newName) {
                alertContainer.innerHTML = `<div class="alert alert-warning">Please enter an account name.</div>`;
                return;
            }
            try {
                const res = await fetch(`/api/accounts?name=${encodeURIComponent(newName.toLowerCase().trim())}`, {
                    method: 'POST'
                });
                const created = await res.json();
                if (!res.ok) throw new Error(created.detail || 'Failed to create account');
                accountId = created.id;

                // add to dropdown and select it
                const select = document.getElementById('account-select');
                const opt = new Option(newName, created.id);
                select.insertBefore(opt, select.querySelector('option[value="__new__"]'));
                select.value = created.id;
                document.getElementById('new-account-section').classList.add('d-none');
            } catch (err) {
                alertContainer.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                return;
            }
        }

        const negate = document.getElementById('negate-check').checked;

        btn.disabled = true;
        btn.textContent = 'Importing...';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('account_id', accountId);
        formData.append('negate', negate);

        try {
            const response = await fetch('/api/import', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Import failed');

            document.getElementById('imported-count').textContent = data.imported;
            document.getElementById('skipped-count').textContent = data.skipped;
            summary.classList.remove('d-none');

        } catch (err) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    ${err.message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Import';
        }
    }

    loadAccounts();
</script>

{% endblock content %}
